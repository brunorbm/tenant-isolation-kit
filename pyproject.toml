[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tenant-isolation-kit"
dynamic = ["version"]
description = "Catch cross-tenant access (IDOR/BOLA) in FastAPI + SQLAlchemy apps: Semgrep rules, a two-tenant pytest matrix and a runtime query guard."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bruno Rangel Borges Marchetti", email = "brunorbm@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["sqlalchemy>=2.0.30,<3"]
keywords = ["multi-tenancy", "idor", "bola", "authorization", "sqlalchemy", "fastapi", "security", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/brunorbm/tenant-isolation-kit"
Source = "https://github.com/brunorbm/tenant-isolation-kit"
Issues = "https://github.com/brunorbm/tenant-isolation-kit/issues"
Changelog = "https://github.com/brunorbm/tenant-isolation-kit/blob/main/CHANGELOG.md"
Security = "https://github.com/brunorbm/tenant-isolation-kit/security/policy"

[project.entry-points.pytest11]
tenant_isolation = "tenant_isolation_kit.pytest_plugin"

[project.optional-dependencies]
dev = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "coverage[toml]>=7.5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.version]
path = "src/tenant_isolation_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tenant_isolation_kit"]

[tool.hatch.build.targets.sdist]
include = [
    "src", "tests", "docs", "examples", "semgrep", "scripts",
    "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -p pytester"
filterwarnings = [
    "error",
    # Starlette >= 1.x asks for httpx2 in its TestClient; older releases need httpx.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.coverage.run]
branch = true
source = ["tenant_isolation_kit"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples", "scripts"]
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "."]
# Semgrep fixtures: annotations are line-based, so formatting would move them.
extend-exclude = ["semgrep"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "PT", "TRY", "PL"]
ignore = [
    "TRY003",  # long messages in exception constructors are intentional
    "PLR2004", # HTTP status codes read better inline
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608", "PLC0415", "BLE001", "TRY", "PT011"]
# The vulnerable app is vulnerable on purpose; the seeded bugs must survive linting.
"examples/vulnerable_app/**" = ["S608"]
"examples/**" = ["S105"]
"scripts/**" = ["S101", "S603"]
